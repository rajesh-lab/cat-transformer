hydra:
  run:
    dir: Results/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

# disable hydra logging
defaults:
    - _self_

# set the seed for reproducibility
seed: 42

dataset:
    name: mqar

    # we will have to use a standard dataloader for this!
    path: /gpfs/data/ranganathlab/Jatin/Datasets/mqar/kv_4_8_16_32_64_seqlen_256
    # tokenizer_name: "gpt2" # there is no toknizer here
    tokenizer_name: null
    vocab_size: 8192

results_dir: Results

wandb:
    project: fineweb-15b
    exp_name: default

################################################################################

# Training-related arguments.
train:

    # Number of optimizer steps between saving checkpoints
    save_interval: 1000

    # Number of workers for loading data
    num_workers: 4

    # Batch size
    batch_size: 128

    # Micro batch size
    # micro_batch_size: 128

    # Number of optimizer steps, please modify according to the dataset and batch size
    train_iters: 20000
    train_epochs: -1

    # Warmup steps percentage
    warmup_steps_percentage: 0.1

    # Warm steps. If these are provided, warmup_steps_percentage is ignored.
    warmup_steps: 1000

    # Gradient clipping
    grad_norm: 1.0

    # calculate grad norm after some train iters
    grad_norm_interval: 25

    grad_accum: 1

    norm_eps: 0.00001

# Evaluation-related arguments.
eval:

    # Number of optimizer steps between testing
    eval_interval: 2000

    # Iters for testing
    eval_iters: 100

# Optimizer-related arguments
optimizer:

    # Learning rate 
    lr: 8e-4

    # Minimum learning rate
    min_lr: 8e-5

    # Weight decay
    weight_decay: 0.1

    # Betas (beta1, beta2)
    betas: [0.9, 0.95]

# results directory
# don't change this, it will be set by the script
result_dir:

# choose from [transformer, cat_transformer, cat_transformer_hybrid]
model_type: transformer

transformer:
    name: transformer

    dim: 768
    block_size: 2048

    n_layer: 12
    n_head: 12

    use_fused_ops: True
    use_qk_norm: True

cat_transformer:
    name: cat_transformer

    block_size: 2048
    chunk_size: 16

    use_fused_ops: True
    use_qk_norm: True

    # decoder
    n_layer: 12
    dim: 1536
    n_head: 12

    dim_fx: 1536

    # compressor
    compressor_dim: 768
    compressor_n_head: 12
    compressor_n_layer: 3

cat_transformer_hybrid:
    name: cat_transformer_hybrid

    block_size: 2048
    chunk_size: 16

    use_fused_ops: True
    use_qk_norm: True

    # decoder
    n_layer: 12
    dim: 1536
    n_head: 12

    dim_fx: 1536

    # compressor
    compressor_dim: 768
    compressor_n_head: 12
    compressor_n_layer: 3

    # hybrid layer assignments (layer indices)
    mamba2_layers: []
    gdn_layers: []
    linear_attn_layers: []

    # mamba2 settings
    mamba2_mode: parallel
    mamba2_state_size: 128
    mamba2_n_groups: 1
    mamba2_conv_kernel: 4
    mamba2_use_conv: true

    # gdn settings
    gdn_mode: parallel
    gdn_use_short_conv: true
    gdn_conv_size: 4


# Populate the model settings based on selection in model_type
model: ${${model_type}}
